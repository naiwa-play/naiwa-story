<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b3939">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>大庙千秋 · 手机测试卷</title>
</head>
<body style="margin:0;background:#eae6d9;color:#314a46">
<main style="padding:15vh 8vw;font:16px/2 sans-serif">
<h1 style="font:36px serif">大庙千秋 · 测试卷</h1>
<p id="loading" role="status">正在展开测试书页…</p>
<button id="retry" hidden style="padding:12px 24px">重新加载</button>
</main>
<script type="module">
// Deliberately separate from the timed release entry. This link is unlisted,
// not authenticated; only this document opts into the existing preview reader.
// Fetch the shared markup so mobile tests use the actual current game layout.
const retry=document.getElementById('retry');
async function prepare(){
 retry.hidden=true;
 try{
  const response=await fetch('./index.html',{cache:'no-cache'});
  if(!response.ok)throw Error('layout');
  const page=new DOMParser().parseFromString(await response.text(),'text/html');
  const sheet=page.querySelector('link[rel="stylesheet"]'),entry=page.querySelector('script[type="module"]');
  if(!sheet||!entry||!page.getElementById('reader'))throw Error('layout');
  const version=new URL(entry.getAttribute('src'),location.href).searchParams.get('v');
  document.head.append(document.importNode(sheet,true));
  document.body.replaceChildren(...[...page.body.children].filter(el=>!['SCRIPT','NOSCRIPT'].includes(el.tagName)).map(el=>document.importNode(el,true)));
  const $=id=>document.getElementById(id);
  $('release-status').textContent='手机测试卷 · 可提前体验';
  $('countdown').textContent='与正式进度分开保存；进入后可用「校样工具」跳到各轮。';
  document.querySelector('.edition').textContent='此链接供测试使用，拿到链接的人也可以访问。正式入口按原定时间开放。';
  $('open').textContent='进入测试卷';$('open').hidden=false;
  let started=false;
  $('open').onclick=async()=>{
   $('open').disabled=true;
   try{
    if(!started){const {start}=await import('./reader.js?v='+encodeURIComponent(version||'5'));start({preview:true});started=true;}
    else{$('gate').hidden=true;$('reader').hidden=false;document.dispatchEvent(new Event('damiao-resume'));}
    $('open').textContent='继续测试';
   }catch{$('release-status').textContent='测试书页未能加载，请点按重试。';}
   finally{$('open').disabled=false;}
  };
 }catch{document.getElementById('loading').textContent='暂时没有连上书页，请联网后重试。';retry.hidden=false;}
}
retry.onclick=prepare;void prepare();
</script>
<noscript>请启用 JavaScript 以打开测试书页。</noscript>
</body>
</html>
