<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>奶蛙与伙伴 · 模型预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3e9;font-family:"Microsoft YaHei",system-ui;color:#2e5546;overflow:hidden}canvas{width:100vw;height:100dvh;display:block;touch-action:none}header{position:absolute;top:24px;left:6%;pointer-events:none}h1{font-weight:500;font-size:24px;letter-spacing:.1em;margin-bottom:10px}p{font-size:12px;color:#7b8c7a;line-height:1.8}.characters{display:flex;gap:8px;pointer-events:auto}nav{position:absolute;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:min(760px,94vw);background:#fffbeddf;padding:12px;border:1px solid #fff9;border-radius:20px;backdrop-filter:blur(12px)}button{border:1px solid #38634d20;border-radius:12px;padding:11px 15px;font:13px "Microsoft YaHei",sans-serif;background:#f0f0e4;color:inherit;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}button[aria-pressed=true]{background:#315c48;color:#fff7df}button:focus-visible{outline:2px solid #c69434;outline-offset:3px}button:disabled{opacity:.5}#status{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);font-size:13px}@media(max-width:600px){header{top:12px}h1{font-size:20px}nav{bottom:max(14px,env(safe-area-inset-bottom))}button{padding:9px 11px;font-size:12px}}
</style></head><body><canvas aria-label="角色三维模型预览，可拖动旋转"></canvas><header><h1 id="model-title">奶蛙 · Q 弹预览</h1><p>完整模型 · 原始贴图<br>拖动旋转 / 滚轮或双指缩放</p><div class="characters" aria-label="选择角色"><button data-character="naiwa" aria-pressed="true">奶蛙</button><button data-character="naigou" aria-pressed="false">奶狗</button><button data-character="naishu" aria-pressed="false">奶鼠</button></div></header><span id="status" role="status">正在加载模型与贴图…</span><nav aria-label="预览控制"><button data-angle="0">正面</button><button data-angle="1.570796">侧面</button><button data-angle="3.141593">背面</button><button data-mode="idle" aria-pressed="false">待机</button><button data-mode="run" aria-pressed="true">弹跳前进</button><button id="hurt">受击旋转</button><button id="spin" aria-pressed="false">自动环视</button><button id="original" aria-pressed="false">原始精度</button></nav><script type="module" src="./model-review.js?v=8"></script></body></html>
